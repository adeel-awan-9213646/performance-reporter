<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Reporter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .btn-pill {
      border: 2px solid #000000;
      background-color: #ffffff;
      color: #000000;
      font-weight: 700;
      border-radius: 9999px;
      padding: 6px 18px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .btn-pill.active {
      background-color: #000000;
      color: #ffffff;
    }
    .table-cell-editable {
      outline: none;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .table-cell-editable:focus {
      background-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 0 2px #ffffff;
    }
    .green-theme { background-color: #16a34a; }
    .blue-theme { background-color: #2563eb; }
    .red-theme { background-color: #dc2626; }
    .gold-theme { background-color: #d97706; }
    .purple-theme { background-color: #9333ea; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto">

  <!-- Title Section -->
  <div class="mb-4">
    <h1 class="text-3xl font-black tracking-tight text-black">Performance Reporter</h1>
    <p class="text-gray-700 text-sm font-semibold mt-0.5">Automated Vicidialer Transformation</p>
  </div>

  <!-- Top Inputs Bar -->
  <div class="grid grid-cols-2 gap-3 mb-3">
    <input type="text" id="supervisorInput" value="Qaiser Khan" oninput="updateSupervisorName(this.value)" class="border-2 border-black rounded-lg px-3 py-2 text-base font-bold bg-white outline-none">
    
    <div class="relative">
      <select id="themeSelector" onchange="changeColorTheme(this.value)" class="w-full border-2 border-black rounded-lg px-3 py-2 text-base font-bold bg-white appearance-none pr-8 cursor-pointer">
        <option value="#16a34a">🟢 Classic Green</option>
        <option value="#2563eb">🔵 Ocean Blue</option>
        <option value="#dc2626">🔴 Crimson Red</option>
        <option value="#d97706">🟡 Amber Gold</option>
        <option value="#9333ea">🟣 Royal Purple</option>
        <option value="custom">🎨 Custom Color</option>
      </select>
      <input type="color" id="customPicker" value="#16a34a" onchange="applyCustomColor(this.value)" class="hidden absolute right-1 top-1.5 w-7 h-7 border border-black rounded cursor-pointer">
    </div>
  </div>

  <!-- Top Action Buttons -->
  <div class="flex gap-3 mb-5">
    <button onclick="resetData()" class="bg-black text-white font-black px-6 py-2 rounded-lg text-sm border-2 border-black">Reset</button>
    <button onclick="copyScreenshot()" class="bg-black text-white font-black px-6 py-2 rounded-lg text-sm border-2 border-black">Copy Screenshot</button>
  </div>

  <!-- Drag & Drop Upload Container -->
  <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-black rounded-xl p-5 text-center cursor-pointer mb-5 bg-gray-50 hover:bg-gray-100 transition">
    <p class="text-sm font-bold text-black flex items-center justify-center gap-2">
      📄 Upload / Drag & Drop Vicidialer CSV File
    </p>
    <input type="file" id="fileInput" accept=".csv" class="hidden" onchange="processCSVUpload(event)">
  </div>

  <!-- Team Filters Box -->
  <div class="border-2 border-black rounded-2xl p-3 bg-gray-100 mb-5">
    <div class="flex flex-wrap gap-2" id="teamsContainer">
      <button class="btn-pill active" onclick="filterByTeam('ALL', this)">All Teams</button>
      <button class="btn-pill" onclick="filterByTeam('OTHER', this)">OTHER</button>
      <button class="btn-pill" onclick="filterByTeam('2.0', this)">2.0</button>
      <button class="btn-pill" onclick="filterByTeam('HQ', this)">HQ</button>
      <button class="btn-pill" onclick="filterByTeam('2.1', this)">2.1</button>
      <button class="btn-pill" onclick="filterByTeam('Team A', this)">Team A</button>
      <button class="btn-pill" onclick="filterByTeam('HQ new', this)">HQ new</button>
      <button class="btn-pill" onclick="filterByTeam('2.0NB', this)">2.0NB</button>
      <button class="btn-pill" onclick="filterByTeam('3.0', this)">3.0</button>
      <button class="btn-pill" onclick="filterByTeam('3.1', this)">3.1</button>
    </div>
  </div>

  <!-- Report Capture Section -->
  <div id="captureArea" class="bg-black rounded-2xl p-2 border-2 border-black text-white">
    
    <!-- File Info Badge -->
    <div class="flex items-center justify-between mb-2 px-1">
      <div id="csvFilename" class="text-xs font-mono font-bold text-white truncate max-w-[220px]">AGENT_PERFORMACE_DETAIL20261001-104413.csv</div>
      <div id="agentBadge" class="bg-emerald-500 text-black font-black text-xs px-3 py-1 rounded-full uppercase">114 AGENTS DETECTED</div>
    </div>

    <!-- Supervisor Header -->
    <div id="supervisorBanner" class="bg-emerald-600 text-white font-black text-2xl text-center py-2 rounded-xl mb-2 tracking-wide">
      Qaiser Khan
    </div>

    <!-- Data Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-white font-extrabold text-xs text-center border-separate border-spacing-y-1">
        <thead>
          <tr class="text-gray-300 border-b border-gray-700">
            <th class="py-2 text-left px-2">USER</th>
            <th class="py-2">ID</th>
            <th class="py-2">D1</th>
            <th class="py-2">D5</th>
            <th class="py-2">D8</th>
            <th class="py-2">TOTAL</th>
            <th class="py-2">SALES</th>
            <th class="py-2">CONV</th>
            <th class="py-2">LAST HR</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Table Rows populated dynamically -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    let defaultAgents = [
      { name: "Michael Tolliver-HQ", id: "1001", d1: 69, d5: 38, d8: 77, total: 184, sales: 82, conv: "44.5%", lastHr: 12, team: "HQ" },
      { name: "Danny Parker 2.0", id: "2018", d1: 79, d5: 23, d8: 75, total: 177, sales: 79, conv: "44.6%", lastHr: 10, team: "2.0" },
      { name: "Dan Muccray-HQ", id: "1016", d1: 59, d5: 46, d8: 64, total: 169, sales: 71, conv: "42.0%", lastHr: 11, team: "HQ" },
      { name: "Jordan Ford-HQ", id: "1002", d1: 58, d5: 22, d8: 65, total: 145, sales: 64, conv: "44.1%", lastHr: 9, team: "HQ" },
      { name: "Bryan Grayson 2.0", id: "2004", d1: 53, d5: 14, d8: 58, total: 125, sales: 55, conv: "44.0%", lastHr: 8, team: "2.0" },
      { name: "Mike James-HQ", id: "1003", d1: 32, d5: 14, d8: 71, total: 117, sales: 50, conv: "42.7%", lastHr: 7, team: "HQ" },
      { name: "Steve Henley-HQ", id: "1024", d1: 17, d5: 41, d8: 56, total: 114, sales: 48, conv: "42.1%", lastHr: 6, team: "HQ" },
      { name: "David Gibson 2.0", id: "2014", d1: 58, d5: 14, d8: 38, total: 110, sales: 45, conv: "40.9%", lastHr: 5, team: "2.0" },
      { name: "Lewis Cooper 2.0", id: "2010", d1: 39, d5: 8, d8: 59, total: 106, sales: 42, conv: "39.6%", lastHr: 5, team: "2.0" },
      { name: "Bryan Wilson 2.0", id: "2032", d1: 35, d5: 20, d8: 50, total: 105, sales: 41, conv: "39.0%", lastHr: 4, team: "2.0" },
      { name: "Oscar Lawson 2.0", id: "2005", d1: 34, d5: 12, d8: 58, total: 104, sales: 40, conv: "38.4%", lastHr: 4, team: "2.0" },
      { name: "Logan Foster 2.0", id: "2034", d1: 38, d5: 14, d8: 50, total: 102, sales: 39, conv: "38.2%", lastHr: 3, team: "2.0" },
      { name: "Jason Morgan - Danish-HQ", id: "1010", d1: 37, d5: 32, d8: 32, total: 101, sales: 38, conv: "37.6%", lastHr: 3, team: "HQ" },
      { name: "Jason Brown-HQ", id: "1004", d1: 23, d5: 18, d8: 55, total: 96, sales: 35, conv: "36.4%", lastHr: 2, team: "HQ" },
      { name: "Nick Clover 2.0", id: "1030", d1: 45, d5: 10, d8: 40, total: 95, sales: 34, conv: "35.7%", lastHr: 2, team: "2.0" }
    ];

    let currentTheme = "#16a34a";
    let activeFilter = "ALL";

    function updateSupervisorName(val) {
      document.getElementById('supervisorBanner').innerText = val || "Supervisor";
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      let list = defaultAgents;
      if (activeFilter !== "ALL") {
        list = defaultAgents.filter(a => a.team.toUpperCase().includes(activeFilter) || a.name.toUpperCase().includes(activeFilter));
      }

      // Sort High to Low by Total Calls
      list.sort((a,b) => b.total - a.total);

      document.getElementById('agentBadge').innerText = `${list.length} AGENTS DETECTED`;

      list.forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.style.backgroundColor = currentTheme;
        
        // Gradient / Opacity hierarchy: High (Top), Mid (Center), Low (Bottom)
        if (i < Math.ceil(list.length * 0.33)) {
          tr.style.opacity = "1";
        } else if (i < Math.ceil(list.length * 0.66)) {
          tr.style.opacity = "0.85";
        } else {
          tr.style.opacity = "0.7";
        }

        tr.className = "rounded text-white hover:brightness-110 transition";

        tr.innerHTML = `
          <td class="py-2.5 text-left px-2 leading-tight font-extrabold"><span class="table-cell-editable" contenteditable="true">${item.name}</span></td>
          <td class="py-2.5"><span class="table-cell-editable" contenteditable="true">${item.id}</span></td>
          <td class="py-2.5"><span class="table-cell-editable" contenteditable="true">${item.d1}</span></td>
          <td class="py-2.5"><span class="table-cell-editable" contenteditable="true">${item.d5}</span></td>
          <td class="py-2.5"><span class="table-cell-editable" contenteditable="true">${item.d8}</span></td>
          <td class="py-2.5 font-black"><span class="table-cell-editable" contenteditable="true">${item.total}</span></td>
          <td class="py-2.5 font-black"><span class="table-cell-editable" contenteditable="true">${item.sales}</span></td>
          <td class="py-2.5"><span class="table-cell-editable" contenteditable="true">${item.conv}</span></td>
          <td class="py-2.5 font-black"><span class="table-cell-editable" contenteditable="true">${item.lastHr}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterByTeam(team, btn) {
      activeFilter = team;
      document.querySelectorAll('.btn-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }

    function changeColorTheme(color) {
      const picker = document.getElementById('customPicker');
      if (color === 'custom') {
        picker.classList.remove('hidden');
        currentTheme = picker.value;
      } else {
        picker.classList.add('hidden');
        currentTheme = color;
      }
      document.getElementById('supervisorBanner').style.backgroundColor = currentTheme;
      document.getElementById('agentBadge').style.backgroundColor = currentTheme;
      renderTable();
    }

    function applyCustomColor(color) {
      currentTheme = color;
      document.getElementById('supervisorBanner').style.backgroundColor = currentTheme;
      document.getElementById('agentBadge').style.backgroundColor = currentTheme;
      renderTable();
    }

    function processCSVUpload(evt) {
      const file = evt.target.files[0];
      if (!file) return;

      document.getElementById('csvFilename').innerText = file.name;
      const reader = new FileReader();

      reader.onload = function(e) {
        const text = e.target.result;
        const rows = text.split('\n');
        let parsed = [];

        rows.forEach((r, idx) => {
          if (idx === 0 || !r.trim()) return;
          const cols = r.split(',').map(c => c.trim().replace(/"/g, ''));
          if (cols.length >= 2) {
            parsed.push({
              name: cols[0] || "Agent",
              id: cols[1] || "1000",
              d1: parseInt(cols[2]) || 0,
              d5: parseInt(cols[3]) || 0,
              d8: parseInt(cols[4]) || 0,
              total: parseInt(cols[5]) || 100,
              sales: parseInt(cols[6]) || 30,
              conv: cols[7] || "30.0%",
              lastHr: parseInt(cols[8]) || 5,
              team: cols[0].includes('HQ') ? 'HQ' : '2.0'
            });
          }
        });

        if (parsed.length > 0) {
          defaultAgents = parsed;
          renderTable();
        }
      };

      reader.readAsText(file);
    }

    function copyScreenshot() {
      const el = document.getElementById('captureArea');
      html2canvas(el).then(canvas => {
        canvas.toBlob(blob => {
          navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(() => {
            alert('Screenshot copied to Clipboard!');
          });
        });
      });
    }

    function resetData() {
      activeFilter = "ALL";
      renderTable();
    }

    renderTable();
  </script>
</body>
</html>
