<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vicidialer Multi-Team Performance Reporter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #111;
        }
        .main-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        /* Top Control Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .title-sec h2 {
            margin: 0;
            color: #000000;
            font-size: 22px;
            font-weight: 800;
        }
        .title-sec p {
            margin: 3px 0 0 0;
            color: #444;
            font-size: 13px;
            font-weight: 600;
        }
        .controls-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-control {
            padding: 7px 10px;
            border-radius: 6px;
            border: 2px solid #000;
            font-weight: bold;
            font-size: 13px;
        }
        .theme-select {
            padding: 7px 10px;
            border-radius: 6px;
            border: 2px solid #000;
            font-weight: bold;
            cursor: pointer;
            background: #fff;
        }
        .btn {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #333333;
        }

        .upload-box {
            border: 2px dashed #000000;
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            color: #000000;
            font-weight: bold;
            font-size: 15px;
        }

        /* Dynamic Team Filter Buttons */
        .team-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 8px;
            border: 1px solid #000;
        }
        .team-btn {
            background: #ffffff;
            border: 1.5px solid #000;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .team-btn.active, .team-btn:hover {
            background: #000000;
            color: #ffffff;
        }

        /* Main Report Header */
        .report-header-banner {
            background-color: #111111;
            color: #ffffff;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #000000;
            border-bottom: none;
        }
        .report-header-banner .badge {
            background: #00c853;
            color: #000;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Classic Vicidialer Table Styling */
        .table-wrapper {
            border-radius: 0 0 6px 6px;
            overflow: hidden;
            border: 2px solid #000000;
        }
        .team-title-banner {
            background-color: #28a745;
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            padding: 10px;
            border-bottom: 2px solid #000000;
            letter-spacing: 0.5px;
        }
        
        table.perf-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* Black Highlighted Headers and Column Grid Lines */
        table.perf-table th {
            background-color: #000000 !important;
            color: #ffffff !important;
            padding: 10px;
            text-transform: uppercase;
            border: 1.5px solid #000000;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        table.perf-table td {
            padding: 7px 10px;
            border: 1px solid #000000;
            text-align: center;
        }
        table.perf-table td.user-cell {
            text-align: left;
            font-weight: 800;
        }

        /* Editable Cells Highlight */
        table.perf-table td[contenteditable="true"]:hover {
            background-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            outline: 2px dashed #000;
        }

        /* Standard Rows Color Coding */
        .row-green { background-color: #00c853 !important; color: #ffffff !important; }
        .row-yellow { background-color: #ffd600 !important; color: #000000 !important; }
        .row-red { background-color: #d50000 !important; color: #ffffff !important; }
        
        /* Footer Totals Row - Green Matching Screenshot */
        .footer-total-row {
            background-color: #00c853 !important;
            color: #ffffff !important;
            font-weight: 900;
            font-size: 14px;
        }
        .footer-total-row td {
            border: 1.5px solid #000000 !important;
            padding: 10px;
        }

        /* Summary Box Below Table */
        .summary-box {
            width: 280px;
            margin: 20px auto 10px auto;
            border: 2px solid #000000;
            font-size: 13px;
            font-weight: 900;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        .summary-row {
            display: flex;
            border-bottom: 1.5px solid #000000;
        }
        .summary-row:last-child {
            border-bottom: none;
        }
        .summary-label {
            width: 60%;
            background-color: #e9ecef;
            padding: 8px 12px;
            border-right: 1.5px solid #000000;
            color: #000000;
        }
        .summary-val {
            width: 40%;
            padding: 8px 12px;
            text-align: center;
            background-color: #ffffff;
            color: #000000;
        }
        .summary-val.highlight-green {
            background-color: #00c853;
            color: #ffffff;
        }

        /* Developer Watermark Footer */
        .dev-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            font-weight: 800;
            color: #000000;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Theme Option Styles */
        body.theme-dark { background-color: #121212; color: #fff; }
        body.theme-dark .main-card { background: #1e1e1e; border: 1px solid #333; }
        body.theme-dark .title-sec h2 { color: #fff; }
        body.theme-dark .title-sec p { color: #aaa; }
        body.theme-dark .upload-box { background: #2a2a2a; color: #fff; border-color: #555; }
        body.theme-dark .team-filter-bar { background: #2a2a2a; border-color: #444; }
        body.theme-dark .team-btn { background: #333; color: #fff; border-color: #555; }
        body.theme-dark .team-btn.active { background: #00c853; color: #000; }
        body.theme-dark .dev-footer { color: #888888; }

        body.theme-blue .team-title-banner { background-color: #0288d1; }
        body.theme-purple .team-title-banner { background-color: #7b1fa2; }
    </style>
</head>
<body class="theme-green">

<div class="main-card">
    <div class="top-bar">
        <div class="title-sec">
            <h2>Performance Reporter</h2>
            <p>Automated Vicidialer Transformation</p>
        </div>
        <div class="controls-group">
            <input type="text" id="leadNameInput" class="input-control" value="Qaiser Khan" placeholder="Enter Lead / Team Name" oninput="updateTeamLeadName(this.value)">
            <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
                <option value="theme-green">🟢 Classic Green</option>
                <option value="theme-dark">🌙 Dark Mode</option>
                <option value="theme-blue">🔵 Ocean Blue</option>
                <option value="theme-purple">🟣 Royal Purple</option>
            </select>
            <button class="btn" onclick="location.reload()">Reset</button>
            <button class="btn" onclick="copyScreenshot()">Copy Screenshot</button>
        </div>
    </div>

    <div class="upload-box" onclick="document.getElementById('csvInput').click()">
        📄 Upload / Drag & Drop Vicidialer CSV File
        <input type="file" id="csvInput" accept=".csv" style="display:none;" onchange="processCSV(this.files[0])">
    </div>

    <!-- Team Filters Container -->
    <div id="teamFilterContainer" class="team-filter-bar" style="display: none;">
        <!-- Dynamic Team Buttons will be generated here -->
    </div>

    <div id="captureArea" style="display:none;">
        <div class="report-header-banner">
            <span id="fileNameDisplay">AGENT_STATUS.csv</span>
            <span class="badge" id="agentCountBadge">0 AGENTS DETECTED</span>
        </div>

        <div class="table-wrapper">
            <div class="team-title-banner" id="teamLeadName">Qaiser Khan</div>
            <table class="perf-table">
                <thead>
                    <tr>
                        <th style="width: 38%;">USER</th>
                        <th style="width: 14%;">ID</th>
                        <th>D1</th>
                        <th>D5</th>
                        <th>D8</th>
                        <th>TOTAL</th>
                        <th>CONV %</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot>
                    <tr class="footer-total-row">
                        <td style="text-align: center;" colspan="2">TOTALS</td>
                        <td id="sumD1">0</td>
                        <td id="sumD5">0</td>
                        <td id="sumD8">0</td>
                        <td id="sumTotal">0</td>
                        <td id="sumConv">0%</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="summary-box">
            <div class="summary-row">
                <div class="summary-label">Total Sales</div>
                <div class="summary-val" id="boxTotalSales">0</div>
            </div>
            <div class="summary-row">
                <div class="summary-label">Total Agents</div>
                <div class="summary-val" id="boxTotalAgents">0</div>
            </div>
            <div class="summary-row">
                <div class="summary-label">L.P.D / Conv %</div>
                <div class="summary-val highlight-green" id="boxLPD">0%</div>
            </div>
        </div>

        <!-- Developer Watermark Footer -->
        <div class="dev-footer">
            Developed by Adeel Awan
        </div>
    </div>
</div>

<script>
let globalAgentsData = [];
let activeTeamFilter = "ALL";

function changeTheme(themeName) {
    document.body.className = themeName;
}

function updateTeamLeadName(val) {
    document.getElementById("teamLeadName").innerText = val.trim() !== "" ? val : "Team Performance";
}

function processCSV(file) {
    if(!file) return;
    document.getElementById('fileNameDisplay').innerText = file.name;

    Papa.parse(file, {
        complete: function(results) {
            parseVicidialData(results.data);
        },
        skipEmptyLines: true
    });
}

function parseVicidialData(data) {
    let headerIdx = -1;
    let colMap = {};

    for (let i = 0; i < data.length; i++) {
        let rowStr = data[i].join(",").toUpperCase();
        if (rowStr.includes("USER") && (rowStr.includes("ID") || rowStr.includes("CALLS") || rowStr.includes("D1"))) {
            headerIdx = i;
            data[i].forEach((col, idx) => {
                colMap[col.trim().toUpperCase()] = idx;
            });
            break;
        }
    }

    if (headerIdx === -1) {
        alert("Vicidialer headers not found in CSV!");
        return;
    }

    globalAgentsData = [];
    let teamSet = new Set();

    for (let i = headerIdx + 1; i < data.length; i++) {
        let row = data[i];
        if (!row || row.length < 2) continue;

        let user = row[colMap["USER"]] || row[0];
        if (!user || user.toUpperCase() === "USER" || user.toLowerCase().includes("time range") || user.toUpperCase().includes("TOTAL")) continue;

        let id = row[colMap["ID"]] || "N/A";
        let d1 = parseInt(row[colMap["D1"]] || 0) || 0;
        let d5 = parseInt(row[colMap["D5"]] || 0) || 0;
        let d8 = parseInt(row[colMap["D8"]] || 0) || 0;
        let calls = parseInt(row[colMap["CALLS"]] || 0) || 0;

        let total = d1 + d5 + d8;
        let conv = calls > 0 ? ((total / calls) * 100) : (total > 0 ? 100 : 0);

        let extractedTeam = "OTHER";
        let teamMatch = user.match(/(Team\s+[A-Z0-9\.\-]+|HQ[A-Za-z0-9\s]*|2\.1\s*[A-Z]?|2\.0NB|2\.0)/i);
        if (teamMatch) {
            extractedTeam = teamMatch[0].trim();
        }

        teamSet.add(extractedTeam);

        globalAgentsData.push({
            user: user,
            id: id,
            d1: d1,
            d5: d5,
            d8: d8,
            total: total,
            calls: calls,
            conv: conv,
            team: extractedTeam
        });
    }

    globalAgentsData.sort((a, b) => b.total - a.total || b.conv - a.conv);

    generateTeamButtons(Array.from(teamSet));
    renderFilteredReport("ALL");
}

function generateTeamButtons(teams) {
    let container = document.getElementById("teamFilterContainer");
    container.innerHTML = `<button class="team-btn active" onclick="renderFilteredReport('ALL', this)">All Teams</button>`;

    teams.forEach(team => {
        container.innerHTML += `<button class="team-btn" onclick="renderFilteredReport('${team}', this)">${team}</button>`;
    });

    container.style.display = "flex";
}

function renderFilteredReport(teamName, btnElement = null) {
    if (btnElement) {
        document.querySelectorAll(".team-btn").forEach(b => b.classList.remove("active"));
        btnElement.classList.add("active");
    }

    activeTeamFilter = teamName;
    let filtered = teamName === "ALL" 
        ? globalAgentsData 
        : globalAgentsData.filter(a => a.team.toLowerCase() === teamName.toLowerCase());

    let tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    filtered.forEach((agent, index) => {
        let tr = document.createElement("tr");
        tr.id = `agent-row-${index}`;
        
        updateRowAppearance(tr, agent, index);
        tbody.appendChild(tr);
    });

    recalculateTotals();
    document.getElementById("captureArea").style.display = "block";
}

function updateRowAppearance(tr, agent, index) {
    let rowClass = "row-red";
    if (agent.total >= 3) {
        rowClass = "row-green";
    } else if (agent.total > 0) {
        rowClass = "row-yellow";
    }
    
    tr.className = rowClass;
    tr.innerHTML = `
        <td class="user-cell" contenteditable="true" oninput="editCell(${index}, 'user', this.innerText)">${agent.user}</td>
        <td contenteditable="true" oninput="editCell(${index}, 'id', this.innerText)">${agent.id}</td>
        <td contenteditable="true" oninput="editCell(${index}, 'd1', this.innerText)">${agent.d1}</td>
        <td contenteditable="true" oninput="editCell(${index}, 'd5', this.innerText)">${agent.d5}</td>
        <td contenteditable="true" oninput="editCell(${index}, 'd8', this.innerText)">${agent.d8}</td>
        <td contenteditable="true" oninput="editCell(${index}, 'total', this.innerText)">${agent.total}</td>
        <td>${agent.conv.toFixed(0)}%</td>
    `;
}

function editCell(index, field, val) {
    let filtered = activeTeamFilter === "ALL" 
        ? globalAgentsData 
        : globalAgentsData.filter(a => a.team.toLowerCase() === activeTeamFilter.toLowerCase());

    let agent = filtered[index];
    if (!agent) return;

    if (field === 'd1' || field === 'd5' || field === 'd8') {
        agent[field] = parseInt(val) || 0;
        agent.total = agent.d1 + agent.d5 + agent.d8;
        agent.conv = agent.calls > 0 ? ((agent.total / agent.calls) * 100) : (agent.total > 0 ? 100 : 0);
    } else if (field === 'total') {
        agent.total = parseInt(val) || 0;
        agent.conv = agent.calls > 0 ? ((agent.total / agent.calls) * 100) : (agent.total > 0 ? 100 : 0);
    } else if (field === 'user') {
        agent.user = val;
    } else if (field === 'id') {
        agent.id = val;
    }

    let tr = document.getElementById(`agent-row-${index}`);
    if (tr) {
        let rowClass = "row-red";
        if (agent.total >= 3) {
            rowClass = "row-green";
        } else if (agent.total > 0) {
            rowClass = "row-yellow";
        }
        tr.className = rowClass;
        
        let cells = tr.getElementsByTagName("td");
        if (cells.length >= 7 && field !== 'total') {
            cells[5].innerText = agent.total;
            cells[6].innerText = agent.conv.toFixed(0) + "%";
        }
    }

    recalculateTotals();
}

function recalculateTotals() {
    let filtered = activeTeamFilter === "ALL" 
        ? globalAgentsData 
        : globalAgentsData.filter(a => a.team.toLowerCase() === activeTeamFilter.toLowerCase());

    let totD1 = 0, totD5 = 0, totD8 = 0, totDeals = 0, totCalls = 0;

    filtered.forEach(agent => {
        totD1 += agent.d1;
        totD5 += agent.d5;
        totD8 += agent.d8;
        totDeals += agent.total;
        totCalls += agent.calls;
    });

    document.getElementById("sumD1").innerText = totD1;
    document.getElementById("sumD5").innerText = totD5;
    document.getElementById("sumD8").innerText = totD8;
    document.getElementById("sumTotal").innerText = totDeals;

    let overallConv = totCalls > 0 ? ((totDeals / totCalls) * 100).toFixed(1) : (totDeals > 0 ? "100" : "0");
    document.getElementById("sumConv").innerText = overallConv + "%";

    document.getElementById("boxTotalSales").innerText = totDeals;
    document.getElementById("boxTotalAgents").innerText = filtered.length;
    document.getElementById("boxLPD").innerText = overallConv + "%";
    document.getElementById("agentCountBadge").innerText = filtered.length + " AGENTS DETECTED";
}

function copyScreenshot() {
    let area = document.getElementById("captureArea");
    html2canvas(area).then(canvas => {
        canvas.toBlob(blob => {
            let item = new ClipboardItem({ "image/png": blob });
            navigator.clipboard.write([item]).then(() => {
                alert("Screenshot copied to clipboard successfully!");
            });
        });
    });
}
</script>
<style>
  [data-netlify-deploy-id], 
  .netlify-badge, 
  #netlify-badge, 
  netlify-plugin-drawer,
  iframe[src*="netlify"] {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
</style>
</body>
</html>
