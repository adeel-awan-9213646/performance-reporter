<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Vicidial Multi-Performance Reporter</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .card { background-color: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #334155; background-color: #0f172a; color: #fff; }
    button { background-color: #0284c7; cursor: pointer; font-weight: bold; border: none; }
    button:hover { background-color: #0369a1; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #334155; padding: 10px; text-align: center; }
    th { background-color: #334155; color: #38bdf8; }
    tr:nth-child(even) { background-color: #1a2234; }
    .hot { color: #4ade80; font-weight: bold; }
    .badge-remove { display: none !important; opacity: 0 !important; }
  </style>
</head>
<body>

  <h1>🚀 Live Vicidial Multi-Dialer Reporter</h1>

  <!-- Configuration Form -->
  <div class="card">
    <h3>🔗 Connect New Vicidialer Link</h3>
    <div class="form-group">
      <input type="text" id="dialerName" placeholder="Dialer Name (e.g. USA Outbound)" required>
      <input type="url" id="dialerUrl" placeholder="https://sbaca3.maxtelco.com/vicidial/non_agent_api.php" style="width: 400px;" required>
      <input type="text" id="apiUser" placeholder="API User" required>
      <input type="password" id="apiPass" placeholder="API Password" required>
      <button onclick="addDialer()">Connect Dialer</button>
    </div>
  </div>

  <!-- Live Multi-Dialer Overview -->
  <div class="card">
    <h3>📊 Connected Dialers Live Status</h3>
    <table>
      <thead>
        <tr>
          <th>Dialer Name</th>
          <th>Total Calls</th>
          <th>D1</th>
          <th>D5</th>
          <th>D8</th>
          <th>D9</th>
          <th>SALE</th>
          <th>Total Deals</th>
          <th>Conversion %</th>
          <th>🔥 Last Hour Sales</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="dialerSummaryTable">
        <tr><td colspan="11">No dialer connected yet. Add a link above.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let dialers = JSON.parse(localStorage.getItem('vici_dialers')) || [];

    function saveDialers() {
      localStorage.setItem('vici_dialers', JSON.stringify(dialers));
      renderSummary();
    }

    function addDialer() {
      const name = document.getElementById('dialerName').value;
      let url = document.getElementById('dialerUrl').value;
      const user = document.getElementById('apiUser').value;
      const pass = document.getElementById('apiPass').value;

      if (!name || !url || !user || !pass) {
        alert("Sari details fill karein!");
        return;
      }

      // Auto correct URL if user pasted HTML page link
      if (!url.includes('non_agent_api.php')) {
        url = url.substring(0, url.lastIndexOf('/')) + '/non_agent_api.php';
      }

      dialers.push({ 
        name, url, user, pass, 
        totalCalls: 0, d1: 0, d5: 0, d8: 0, d9: 0, sale: 0, totalDeals: 0, lastHourSales: 0 
      });
      saveDialers();
      fetchLiveMetrics();
      alert("Dialer Link Saved Successfully!");
    }

    function renderSummary() {
      const tbody = document.getElementById('dialerSummaryTable');
      if (dialers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11">No dialer connected yet. Add a link above.</td></tr>';
        return;
      }

      tbody.innerHTML = dialers.map(d => {
        const conv = d.totalCalls > 0 ? ((d.totalDeals / d.totalCalls) * 100).toFixed(2) : '0.00';
        return `
          <tr>
            <td><b>${d.name}</b></td>
            <td>${d.totalCalls}</td>
            <td>${d.d1 || 0}</td>
            <td>${d.d5 || 0}</td>
            <td>${d.d8 || 0}</td>
            <td>${d.d9 || 0}</td>
            <td>${d.sale || 0}</td>
            <td><b>${d.totalDeals}</b></td>
            <td>${conv}%</td>
            <td class="hot">${d.lastHourSales || 0} Deals</td>
            <td>🟢 Live (Auto-Refresh)</td>
          </tr>
        `;
      }).join('');
    }

    async function fetchLiveMetrics() {
      for (let d of dialers) {
        const apiUrl = `${d.url}?source=reporter&user=${d.user}&pass=${d.pass}&function=agent_stats_export&stage=csv`;
        
        try {
          // Fetch API response
          const response = await fetch(apiUrl);
          const data = await response.text();
          
          if (data && !data.includes("ERROR")) {
            // Process API response string
            const lines = data.trim().split("\n");
            let calls = 0, deals = 0;

            lines.forEach((line, index) => {
              if (index > 0) {
                const cols = line.split(",");
                if (cols.length > 3) {
                  calls += parseInt(cols[2] || 0);
                  deals += parseInt(cols[cols.length - 1] || 0);
                }
              }
            });

            d.totalCalls = calls;
            d.totalDeals = deals;
          }
        } catch (err) {
          console.log("CORS / Network attempt for:", d.name);
        }
      }
      renderSummary();
    }

    setInterval(fetchLiveMetrics, 60000);
    renderSummary();
  </script>

  <!-- Netlify Hide Badge Overlay -->
  <style>
    [data-netlify-deploy-id], .netlify-badge, #netlify-badge, netlify-plugin-drawer, iframe[src*="netlify"] {
      display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
    }
  </style>

</body>
</html>
