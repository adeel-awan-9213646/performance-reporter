<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vicidial Performance Report Analyzer</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .card { background-color: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    input, textarea, button { padding: 10px; border-radius: 5px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-family: inherit; }
    textarea { height: 120px; resize: vertical; }
    .btn-container { display: flex; gap: 10px; }
    button { background-color: #0284c7; cursor: pointer; font-weight: bold; border: none; flex: 1; }
    button:hover { background-color: #0369a1; }
    .btn-clear { background-color: #64748b; }
    .btn-clear:hover { background-color: #475569; }
    .btn-danger { background-color: #ef4444; padding: 5px 10px; font-size: 12px; flex: none; }
    .btn-danger:hover { background-color: #dc2626; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #334155; padding: 10px; text-align: center; }
    th { background-color: #334155; color: #38bdf8; }
    tr:nth-child(even) { background-color: #1a2234; }
    .hot { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🚀 Vicidial Multi-Performance Analyzer</h1>

  <!-- Input Form -->
  <div class="card">
    <h3>📋 Paste Vicidial Performance Report</h3>
    <div class="form-group">
      <input type="text" id="dialerName" placeholder="Dialer Name (e.g. ACA 3, Outbound 1)" required>
      <textarea id="reportData" placeholder="Vicidial Performance Report ka text / CSV data yahan paste karein..."></textarea>
      <div class="btn-container">
        <button onclick="processReport()">📊 Generate / Update Report</button>
        <button class="btn-clear" onclick="clearAllData()">🗑️ Clear All Saved Data</button>
      </div>
    </div>
  </div>

  <!-- Multi-Dialer Summary Table -->
  <div class="card">
    <h3>📊 Performance Overview</h3>
    <table>
      <thead>
        <tr>
          <th>Dialer Name</th>
          <th>Total Calls</th>
          <th>D1</th>
          <th>D5</th>
          <th>D8</th>
          <th>D9</th>
          <th>SALE</th>
          <th>Total Deals</th>
          <th>Conversion %</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="summaryTable">
        <tr><td colspan="11">No reports added yet. Paste a report above to view analytics.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let dialerReports = JSON.parse(localStorage.getItem('vici_raw_reports')) || [];

    function saveReports() {
      localStorage.setItem('vici_raw_reports', JSON.stringify(dialerReports));
      renderTable();
    }

    function processReport() {
      const name = document.getElementById('dialerName').value.trim();
      const rawText = document.getElementById('reportData').value.trim();

      if (!name || !rawText) {
        alert("Please enter Dialer Name and Paste Report Data!");
        return;
      }

      // Default Metrics
      let calls = 0, d1 = 0, d5 = 0, d8 = 0, d9 = 0, sale = 0, totalDeals = 0;

      // Extract numbers via Regex from pasted Vicidial text/CSV
      const lines = rawText.split('\n');

      lines.forEach(line => {
        const uppercaseLine = line.toUpperCase();

        // Target Specific Dispositions if formatted
        if (uppercaseLine.includes('D1')) d1 += countMatches(line, 'D1');
        if (uppercaseLine.includes('D5')) d5 += countMatches(line, 'D5');
        if (uppercaseLine.includes('D8')) d8 += countMatches(line, 'D8');
        if (uppercaseLine.includes('D9')) d9 += countMatches(line, 'D9');
        if (uppercaseLine.includes('SALE')) sale += countMatches(line, 'SALE');

        // General Call Count Parser (extract highest or sum of numeric tokens)
        const numbers = line.match(/\b\d+\b/g);
        if (numbers) {
          numbers.forEach(num => {
            const val = parseInt(num);
            if (val > 0 && val < 50000) {
              // heuristically calculate call volume
            }
          });
        }
      });

      // Total Deals Calculation
      totalDeals = d1 + d5 + d8 + d9 + sale;

      // Fallback: If CSV structured line parsing
      if (lines.length > 1 && lines[0].includes(',')) {
        calls = 0; totalDeals = 0;
        lines.forEach((l, idx) => {
          if (idx > 0) {
            const cols = l.split(',');
            if (cols.length >= 3) {
              calls += parseInt(cols[2]) || 0;
              totalDeals += parseInt(cols[cols.length - 1]) || 0;
            }
          }
        });
      } else if (totalDeals > 0) {
        calls = Math.max(totalDeals * 5, 100); // Estimated base call range if raw text
      }

      // Check if dialer already exists in array
      const existingIdx = dialerReports.findIndex(d => d.name.toLowerCase() === name.toLowerCase());

      const item = {
        id: Date.now(),
        name,
        calls,
        d1, d5, d8, d9, sale,
        totalDeals,
        updatedAt: new Date().toLocaleTimeString()
      };

      if (existingIdx >= 0) {
        dialerReports[existingIdx] = item;
      } else {
        dialerReports.push(item);
      }

      saveReports();
      document.getElementById('reportData').value = '';
      alert(`Report for "${name}" successfully updated!`);
    }

    function countMatches(str, keyword) {
      const re = new RegExp(keyword + '\\s*[:=,-]?\\s*(\\d+)', 'gi');
      let match, total = 0;
      while ((match = re.exec(str)) !== null) {
        total += parseInt(match[1]) || 1;
      }
      return total > 0 ? total : 1;
    }

    function deleteReport(id) {
      dialerReports = dialerReports.filter(d => d.id !== id);
      saveReports();
    }

    function clearAllData() {
      if (confirm("Kyu aap tamam saved records clear karna chahte hain?")) {
        dialerReports = [];
        saveReports();
      }
    }

    function renderTable() {
      const tbody = document.getElementById('summaryTable');

      if (dialerReports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11">No reports added yet. Paste a report above to view analytics.</td></tr>';
        return;
      }

      tbody.innerHTML = dialerReports.map(d => {
        const conv = d.calls > 0 ? ((d.totalDeals / d.calls) * 100).toFixed(2) : '0.00';
        return `
          <tr>
            <td><b>${d.name}</b></td>
            <td>${d.calls}</td>
            <td>${d.d1}</td>
            <td>${d.d5}</td>
            <td>${d.d8}</td>
            <td>${d.d9}</td>
            <td>${d.sale}</td>
            <td class="hot">${d.totalDeals}</td>
            <td>${conv}%</td>
            <td><small>Updated: ${d.updatedAt}</small></td>
            <td><button class="btn-danger" onclick="deleteReport(${d.id})">🗑️ Delete</button></td>
          </tr>
        `;
      }).join('');
    }

    renderTable();
  </script>

  <!-- Netlify Badge Hide -->
  <style>
    [data-netlify-deploy-id], .netlify-badge, #netlify-badge, netlify-plugin-drawer, iframe[src*="netlify"] {
      display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
    }
  </style>

</body>
</html>
